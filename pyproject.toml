[project]
name = "agentic-qa-framework"
version = "0.1.0"
description = "QuAIA - an open-source framework for intelligent automation of the software testing life cycle."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"

# Shared runtime dependencies for the orchestrator and all agents.
dependencies = [
    "pydantic-ai-slim[google,mcp,openai]==1.89.0",
    "a2a-sdk==1.0.3",
    "allure-python-commons==2.15.2",
    "python-dotenv==1.2.2",
    "gunicorn==23.0.0",
    "google-cloud-logging==3.13.0",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "python-dateutil==2.9.0.post0",
    "requests==2.33.0",
    "qdrant-client==1.16.2",
    "PyJWT==2.12.0",
    "jira==3.10.5",
    "sse-starlette==3.4.1",
    "google-cloud-run==0.16.1",
]

# Optional, service-specific dependencies installed only in the respective
# service images on top of the shared base (see services/*/Dockerfile).
[project.optional-dependencies]
embedding-service = [
    "FlagEmbedding==1.3.5",
    "sentence-transformers==5.2.2",
    "einops==0.8.2",
]
# Visual backend of the embedding service (opt-in): sentence-transformers already
# provides the model runtime; Pillow is what sentence-transformers[image] adds for
# image inputs (no torchvision needed for inference).
embedding-visual = [
    "pillow==12.3.0",
]
prompt-guard-service = [
    "transformers==4.57.3",
    "torch==2.9.1",
]
# The RAG sync runtime's attachment ingestion (services/rag_sync): PDF text and
# page rendering, image normalization, OCR, native office readers.
rag-sync = [
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
]

# Local development and CI tooling. Not installed into production images.
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-asyncio==1.3.0",
    "ruff",
    "bandit",
]

[tool.uv]
# This is a deployable application, not a distributable package.
package = false

[project]
name = "agentic-qa-framework"
version = "0.1.0"
description = "QuAIA - an open-source framework for intelligent automation of the software testing life cycle."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"

# Shared runtime dependencies for the orchestrator and all agents.
dependencies = [
    "pydantic-ai-slim[anthropic,google,mcp,openai]==2.46.0",
    "a2a-sdk==1.1.5",
    "allure-python-commons==2.16.1",
    "python-dotenv==1.2.3",
    "gunicorn==26.2.0",
    "uvicorn-worker==0.4.0",
    "google-cloud-logging==3.16.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    # The model SDKs and the MCP client speak httpx2, whose exceptions and clients the code uses directly.
    "httpx2==2.13.0",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "qdrant-client==1.19.1",
    "PyJWT==2.14.0",
    "jira==3.10.5",
    "sse-starlette==3.4.11",
    "google-cloud-run==0.16.1",
    "bcrypt==5.0.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "tenacity==9.1.4",
    "PyYAML==6.0.3",
]

# Optional, service-specific dependencies installed only in the respective
# service images on top of the shared base (see services/*/Dockerfile).
[project.optional-dependencies]
embedding-service = [
    "FlagEmbedding==1.4.2",
    "sentence-transformers==6.1.0",
    "einops==0.8.2",
    "huggingface-hub==1.32.0",
]
prompt-guard-service = [
    "transformers==5.17.0",
    "torch==2.14.0",
]
# The RAG sync runtime's attachment ingestion (services/rag_sync): PDF text and
# page rendering, image normalization, OCR, native office readers.
rag-sync = [
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
]

# Local development and CI tooling. Not installed into production images.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "ruff",
    "bandit",
]

[tool.uv]
# This is a deployable application, not a distributable package.
package = false

# The ML services run on CPU only; the default Linux torch wheel pulls ~2.4 GB of unused CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

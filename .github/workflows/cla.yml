name: CLA

on:
  issue_comment:
    types: [ created ]
  pull_request_target:
    types: [ opened, closed, synchronize ]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signatures
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the QuAIA CLA 1.0 and I hereby sign it. No employer or client has rights to my contributions, or I have sent the maintainer their signed Employer Statement.'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          remote-organization-name: partarstu
          remote-repository-name: cla-signatures
          branch: main
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/partarstu/agentic-qa-framework/blob/main/CLA.md
          custom-pr-sign-comment: 'I have read the QuAIA CLA 1.0 and I hereby sign it. No employer or client has rights to my contributions, or I have sent the maintainer their signed Employer Statement.'
          allowlist: partarstu,dependabot[bot]

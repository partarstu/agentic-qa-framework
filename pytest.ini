[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Smoke tests need the docker-compose.smoke.yml stack up, and A/B tests the same stack on a real,
# billed model, so a bare run excludes both. CI overrides this with an explicit -m (the test job
# uses "not smoke and not ab", the smoke job "smoke", the manual A/B workflow "ab"); locally, opt
# in with -m smoke or -m ab.
addopts = -m "not smoke and not ab"
markers =
    smoke: hermetic end-to-end checks driving the orchestrator + agents in docker-compose with every external boundary mocked, the LLM included
    ab: comparison of each LLM-driven workflow's outputs on a real model against its committed baseline; run manually only

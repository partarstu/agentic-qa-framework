[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Smoke tests need the docker-compose.smoke.yml stack up, so exclude them from a
# bare run by default. CI overrides this with an explicit -m (the test job uses
# "not smoke"; the smoke job uses "smoke"); locally, opt in with -m smoke.
addopts = -m "not smoke"
markers =
    smoke: hermetic end-to-end checks driving the orchestrator + agents in docker-compose with mocked external boundaries
